<!DOCTYPE html>
<html lang="en">
<head>
<script src="en-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 1: Noun — EnglishNotebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --paper:#F7F4EC;
    --paper-line:#E4DFD0;
    --green:#2F6F5E;
    --clay:#B5482A;
    --muted:#8A8370;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  header.topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(247,244,236,0.94);
    backdrop-filter: blur(6px);
    border-bottom:2px solid var(--ink);
    padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .back-link{
    font-size:14px; font-weight:600; color:var(--ink);
    text-decoration:none; display:flex; align-items:center; gap:6px;
  }
  .back-link:hover{color:var(--green);}
  .brand{
    font-family:'Fraunces', serif; font-weight:700; font-size:18px;
  }
  .brand span{color:var(--green);}
  .topbar-status{font-size:13px; color:var(--muted);}

  main{max-width:820px; margin:0 auto; padding:40px 24px 100px;}

  .eyebrow{
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--green); font-weight:600; margin-bottom:10px;
  }
  h1.title{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:clamp(28px, 4.5vw, 40px);
    line-height:1.15; margin:0 0 32px;
  }

  /* Lesson content cards */
  .kind-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    margin-bottom:48px;
  }
  .kind-card{
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:12px;
    padding:16px 18px;
  }
  .kind-card h3{
    font-family:'Fraunces',serif; font-size:16px; font-weight:600;
    margin:0 0 6px; color:var(--ink);
  }
  .kind-card p.def{font-size:13.5px; color:var(--ink); opacity:0.8; margin:0 0 8px; line-height:1.5;}
  .kind-card p.ex{font-size:12.5px; color:var(--green); margin:0; font-weight:500;}

  /* Practice sections */
  .section-block{margin-bottom:44px;}
  .section-title{
    font-family:'Fraunces',serif; font-size:20px; font-weight:600;
    margin:0 0 4px;
  }
  .section-sub{font-size:13.5px; color:var(--muted); margin:0 0 18px;}

  .q-row{
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:10px;
    display:grid;
    grid-template-columns: 32px 1fr 200px 28px;
    align-items:center;
    gap:14px;
    transition: border-color 0.15s ease;
  }
  .q-row.correct{border-color:var(--green);}
  .q-row.incorrect{border-color:var(--clay);}
  .q-num{font-size:13px; color:var(--muted); font-weight:600;}
  .q-word{font-size:16px; font-weight:600; font-family:'Fraunces',serif;}
  select.q-select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border-radius:8px;
    border:1.5px solid var(--paper-line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  select.q-select:focus-visible{outline:2px solid var(--green); outline-offset:1px;}
  .q-feedback{font-size:18px; text-align:center;}
  .q-hint{
    grid-column: 1 / -1;
    font-size:13px; color:var(--clay); margin-top:8px;
    padding-top:8px; border-top:1px dashed var(--paper-line);
    display:none;
  }
  .q-row.incorrect .q-hint{display:block;}

  @media (max-width:600px){
    .kind-grid{grid-template-columns:1fr;}
    .q-row{grid-template-columns: 24px 1fr; row-gap:10px;}
    select.q-select{grid-column:1 / -1;}
    .q-feedback{grid-column:1 / -1; text-align:left;}
  }

  /* Lesson progress footer bar */
  .progress-bar-wrap{
    position:sticky; bottom:0; z-index:5;
    background:rgba(247,244,236,0.95);
    backdrop-filter:blur(6px);
    border-top:1.5px solid var(--ink);
    padding:14px 24px;
    display:flex; align-items:center; gap:16px;
  }
  .progress-bar-wrap .pb-label{font-size:13px; color:var(--muted); white-space:nowrap;}
  .progress-track{flex:1; height:8px; background:var(--paper-line); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--green); width:0%; transition:width 0.3s ease;}
  .pb-stat{font-size:13px; font-weight:600; white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){
    .q-row, .progress-fill{transition:none;}
  }

  /* ── Dark Mode ── */
  [data-theme="dark"]{
    --ink:#E8E4DA; --paper:#141B2D; --paper-line:#1F2D45;
    --green:#4CAF8A; --clay:#E07055; --muted:#7A8FA6; --card:#1A2540;
  }
  [data-theme="dark"] body{ background:var(--paper); color:var(--ink); }
  [data-theme="dark"] header.topbar{ background:rgba(20,27,45,0.96)!important; }
  [data-theme="dark"] .q-row,
  [data-theme="dark"] .kind-card,
  [data-theme="dark"] .lesson-card,
  [data-theme="dark"] .tense-row,
  [data-theme="dark"] .mistake-card,
  [data-theme="dark"] .story-card,
  [data-theme="dark"] .ref-table-wrap table,
  [data-theme="dark"] .summary-card{ background:var(--card)!important; border-color:var(--paper-line)!important; }
  [data-theme="dark"] input,
  [data-theme="dark"] select,
  [data-theme="dark"] textarea{ background:var(--paper)!important; color:var(--ink)!important; border-color:var(--paper-line)!important; }
  [data-theme="dark"] .progress-bar-wrap{ background:rgba(20,27,45,0.97)!important; border-color:var(--paper-line)!important; }

  #dark-toggle{
    background:none; border:1.5px solid var(--paper-line); border-radius:20px;
    padding:5px 11px; cursor:pointer; color:var(--ink); font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600; transition:all 0.2s;
  }
  #dark-toggle:hover{ border-color:var(--green); color:var(--green); }

</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back-link">← Home</a>
  <div class="brand">English<span>Notebook</span></div>
  <div class="topbar-status" id="topbar-status">Free Plan</div>
</header>

<main>
  <div class="eyebrow">Lesson 1</div>
  <h1 class="title">Noun — the naming word</h1>

  <div class="kind-grid" id="kind-grid"></div>

  <div id="sections"></div>
</main>

<div class="progress-bar-wrap">
  <span class="pb-label">Lesson progress</span>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <span class="pb-stat" id="progress-stat">0 / 45 correct</span>
</div>

<script>
/* ===================== Data ===================== */
const LESSON_ID = "l1_noun";
const STORAGE_KEY = "englishnotebook_progress_v1";

const KINDS = [
  { name:"Common Noun", def:"Names which are common for anyone", ex:"e.g. boy, girl, teacher, school, park" },
  { name:"Proper Noun", def:"Names which are specific for someone/something", ex:"e.g. Ali, Karachi, Ramadan, Toyota" },
  { name:"Collective Noun", def:"Names for groups of people/things/animals", ex:"e.g. police, army, class, herd, family" },
  { name:"Material Noun", def:"Names for things used to make products", ex:"e.g. wood, iron, cotton, gold, plastic" },
  { name:"Abstract Noun", def:"Names for things we cannot see or touch", ex:"e.g. happiness, honesty, idea, advice, friendship" },
  { name:"Concrete Noun", def:"Names for things we CAN see or touch", ex:"e.g. table, fan, book, car, chair" },
  { name:"Countable Noun", def:"Names for things we can count", ex:"e.g. boy, girl, table, book, car" },
  { name:"Uncountable Noun", def:"Names for things we cannot count", ex:"e.g. water, sugar, milk, air, honesty" },
];

const SECTIONS = [
  {
    id:"secA",
    title:"Section A: Which Kind of Noun?",
    sub:"Common / Proper / Collective / Material / Abstract",
    options:["Common Noun","Proper Noun","Collective Noun","Material Noun","Abstract Noun"],
    questions:[
      {w:"boy", a:"Common Noun"},{w:"river", a:"Common Noun"},{w:"mountain", a:"Common Noun"},
      {w:"pen", a:"Common Noun"},{w:"school", a:"Common Noun"},
      {w:"Ali", a:"Proper Noun"},{w:"Lahore", a:"Proper Noun"},{w:"Ramadan", a:"Proper Noun"},
      {w:"Everest", a:"Proper Noun"},{w:"Nokia", a:"Proper Noun"},
      {w:"team", a:"Collective Noun"},{w:"army", a:"Collective Noun"},{w:"jury", a:"Collective Noun"},
      {w:"herd", a:"Collective Noun"},{w:"committee", a:"Collective Noun"},
      {w:"iron", a:"Material Noun"},{w:"wood", a:"Material Noun"},{w:"cotton", a:"Material Noun"},
      {w:"glass", a:"Material Noun"},{w:"silver", a:"Material Noun"},
      {w:"love", a:"Abstract Noun"},{w:"honesty", a:"Abstract Noun"},{w:"freedom", a:"Abstract Noun"},
      {w:"courage", a:"Abstract Noun"},{w:"wisdom", a:"Abstract Noun"},
    ]
  },
  {
    id:"secB",
    title:"Section B: Concrete or Abstract?",
    sub:"Can you see/touch it, or not?",
    options:["Concrete Noun","Abstract Noun"],
    questions:[
      {w:"table", a:"Concrete Noun"},{w:"dog", a:"Concrete Noun"},{w:"phone", a:"Concrete Noun"},
      {w:"tree", a:"Concrete Noun"},{w:"car", a:"Concrete Noun"},
      {w:"happiness", a:"Abstract Noun"},{w:"honesty", a:"Abstract Noun"},{w:"freedom", a:"Abstract Noun"},
      {w:"courage", a:"Abstract Noun"},{w:"patience", a:"Abstract Noun"},
    ]
  },
  {
    id:"secC",
    title:"Section C: Countable or Uncountable?",
    sub:"Can you count it, or not?",
    options:["Countable Noun","Uncountable Noun"],
    questions:[
      {w:"book", a:"Countable Noun"},{w:"apple", a:"Countable Noun"},{w:"chair", a:"Countable Noun"},
      {w:"student", a:"Countable Noun"},{w:"car", a:"Countable Noun"},
      {w:"water", a:"Uncountable Noun"},{w:"sugar", a:"Uncountable Noun"},{w:"milk", a:"Uncountable Noun"},
      {w:"air", a:"Uncountable Noun"},{w:"rice", a:"Uncountable Noun"},
    ]
  }
];

/* ===================== Storage ===================== */
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { plan:"free", lessons:{} };
  }catch(e){ console.error("Progress load failed", e); return { plan:"free", lessons:{} }; }
}
function saveProgress(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ console.error("Progress save failed", e); }
}
function getLessonData(progress){
  if(!progress.lessons[LESSON_ID]) progress.lessons[LESSON_ID] = { questions:{} };
  return progress.lessons[LESSON_ID];
}

/* ===================== Render lesson content ===================== */
function renderKinds(){
  const grid = document.getElementById("kind-grid");
  grid.innerHTML = KINDS.map(k => `
    <div class="kind-card">
      <h3>${k.name}</h3>
      <p class="def">${k.def}</p>
      <p class="ex">${k.ex}</p>
    </div>
  `).join("");
}

/* ===================== Render practice ===================== */
function renderSections(){
  const progress = loadProgress();
  const lessonData = getLessonData(progress);
  const container = document.getElementById("sections");
  container.innerHTML = "";

  SECTIONS.forEach(section=>{
    const block = document.createElement("div");
    block.className = "section-block";

    const optionsHtml = `<option value="">— select —</option>` +
      section.options.map(o=>`<option value="${o}">${o}</option>`).join("");

    const rowsHtml = section.questions.map((q, idx)=>{
      const qid = `${section.id}_${idx}`;
      const saved = lessonData.questions[qid];
      const state = saved && saved.attempted ? (saved.correct ? "correct" : "incorrect") : "";
      const selectedVal = saved ? saved.value || "" : "";
      return `
        <div class="q-row ${state}" data-qid="${qid}" data-answer="${q.a}" data-word="${q.w}">
          <div class="q-num">${idx+1}</div>
          <div class="q-word">${q.w}</div>
          <select class="q-select" aria-label="Classify ${q.w}">
            ${optionsHtml}
          </select>
          <div class="q-feedback">${state === "correct" ? "✅" : state === "incorrect" ? "❌" : ""}</div>
          <div class="q-hint">Tip: <strong>${q.w}</strong> is a ${q.a}</div>
        </div>
      `;
    }).join("");

    block.innerHTML = `
      <h2 class="section-title">${section.title}</h2>
      <p class="section-sub">${section.sub}</p>
      ${rowsHtml}
    `;
    container.appendChild(block);

    // restore selected values after DOM insert
    section.questions.forEach((q, idx)=>{
      const qid = `${section.id}_${idx}`;
      const saved = lessonData.questions[qid];
      if(saved && saved.value){
        const row = block.querySelector(`[data-qid="${qid}"]`);
        row.querySelector("select").value = saved.value;
      }
    });
  });

  container.addEventListener("change", handleAnswerChange);
  updateProgressBar();
}

function handleAnswerChange(e){
  if(!e.target.classList.contains("q-select")) return;
  const row = e.target.closest(".q-row");
  const qid = row.dataset.qid;
  const correctAnswer = row.dataset.answer;
  const value = e.target.value;

  const progress = loadProgress();
  const lessonData = getLessonData(progress);

  if(value === ""){
    delete lessonData.questions[qid];
    row.classList.remove("correct","incorrect");
    row.querySelector(".q-feedback").textContent = "";
  } else {
    const isCorrect = value === correctAnswer;
    const wordEl = row.querySelector(".q-word");
    lessonData.questions[qid] = {
      attempted:true,
      correct:isCorrect,
      value:value,
      question: wordEl ? wordEl.textContent : row.dataset.word || "",
      correctAnswer: correctAnswer,
      lastAttempt: new Date().toISOString()
    };
    row.classList.remove("correct","incorrect");
    row.classList.add(isCorrect ? "correct" : "incorrect");
    row.querySelector(".q-feedback").textContent = isCorrect ? "✅" : "❌";
  }

  saveProgress(progress);
  updateProgressBar();
}

function updateProgressBar(){
  const progress = loadProgress();
  const lessonData = getLessonData(progress);
  const qs = Object.values(lessonData.questions);
  const total = SECTIONS.reduce((sum,s)=>sum+s.questions.length,0);
  const correct = qs.filter(q=>q.correct).length;
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;

  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-stat").textContent = `${correct} / ${total} correct`;
  document.getElementById("topbar-status").textContent = progress.plan === "paid" ? "Paid Plan" : "Free Plan";
}

renderKinds();
renderSections();
</script>


<script src="en-ai.js">
/* ── Dark Mode ── */
function toggleDark(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('en_theme', newTheme);
  const btn = document.getElementById('dark-toggle');
  if(btn) btn.textContent = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
}
(function(){
  const saved = localStorage.getItem('en_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
    const btn = document.getElementById('dark-toggle');
    if(btn) btn.textContent = '☀️ Light';
  }
})();

</script>

<script src="en-gamification.js"></script>
</body>
</html>
