<!DOCTYPE html>
<html lang="en">
<head>
<script src="en-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tense Chart — EnglishNotebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --paper:#F7F4EC; --paper-line:#E4DFD0;
    --green:#2F6F5E; --clay:#B5482A; --muted:#8A8370; --card:#FFFFFF; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;}

  header.topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(247,244,236,0.94); backdrop-filter: blur(6px);
    border-bottom:2px solid var(--ink); padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .back-link{font-size:14px; font-weight:600; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:6px;}
  .back-link:hover{color:var(--green);}
  .brand{font-family:'Fraunces', serif; font-weight:700; font-size:18px;}
  .brand span{color:var(--green);}

  main{max-width:1000px; margin:0 auto; padding:40px 24px 80px;}
  .eyebrow{font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--green); font-weight:600; margin-bottom:10px;}
  h1.title{font-family:'Fraunces', serif; font-weight:600; font-size:clamp(28px, 4.5vw, 40px); line-height:1.15; margin:0 0 8px;}
  p.note{font-size:13.5px; color:var(--muted); margin:0 0 32px;}

  .grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;
  }
  .cell{
    background:var(--card); border:1.5px solid var(--paper-line); border-radius:12px;
    padding:18px 18px 16px;
  }
  .cell h3{
    font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 10px;
    padding-bottom:8px; border-bottom:1px solid var(--paper-line);
  }
  .cell .structure{font-size:12.5px; color:var(--green); font-weight:600; margin:0 0 6px;}
  .cell .example{font-size:13.5px; color:var(--ink); margin:0 0 10px;}

  .row-label{
    grid-column:1/-1; font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--muted); font-weight:600; margin:26px 0 -6px;
  }
  .row-label:first-of-type{margin-top:6px;}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
  }

  /* ── Dark Mode ── */
  [data-theme="dark"]{
    --ink:#E8E4DA; --paper:#141B2D; --paper-line:#1F2D45;
    --green:#4CAF8A; --clay:#E07055; --muted:#7A8FA6; --card:#1A2540;
  }
  [data-theme="dark"] body{ background:var(--paper); color:var(--ink); }
  [data-theme="dark"] header.topbar{ background:rgba(20,27,45,0.96)!important; }
  [data-theme="dark"] .q-row,
  [data-theme="dark"] .kind-card,
  [data-theme="dark"] .lesson-card,
  [data-theme="dark"] .tense-row,
  [data-theme="dark"] .mistake-card,
  [data-theme="dark"] .story-card,
  [data-theme="dark"] .ref-table-wrap table,
  [data-theme="dark"] .summary-card{ background:var(--card)!important; border-color:var(--paper-line)!important; }
  [data-theme="dark"] input,
  [data-theme="dark"] select,
  [data-theme="dark"] textarea{ background:var(--paper)!important; color:var(--ink)!important; border-color:var(--paper-line)!important; }
  [data-theme="dark"] .progress-bar-wrap{ background:rgba(20,27,45,0.97)!important; border-color:var(--paper-line)!important; }

  #dark-toggle{
    background:none; border:1.5px solid var(--paper-line); border-radius:20px;
    padding:5px 11px; cursor:pointer; color:var(--ink); font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600; transition:all 0.2s;
  }
  #dark-toggle:hover{ border-color:var(--green); color:var(--green); }

</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back-link">← Home</a>
  <div class="brand">English<span>Notebook</span></div>
</header>

<main>
  <div class="eyebrow">Reference</div>
  <h1 class="title">Chart of Tenses</h1>
  <p class="note">Quick reference — 12 tenses, structure and example. This is for review only, not practice.</p>

  <div class="grid" id="chart-grid"></div>
</main>

<script>
const CHART = [
  ["Simple", [
    { name:"Present Simple", structure:"do/does + 1st form", example:"I play." },
    { name:"Past Simple", structure:"did + 1st form", example:"I played." },
    { name:"Future Simple", structure:"will + 1st form", example:"I will play." },
  ]],
  ["Continuous", [
    { name:"Present Continuous", structure:"am/is/are + 4th form", example:"I am playing." },
    { name:"Past Continuous", structure:"was/were + 4th form", example:"I was playing." },
    { name:"Future Continuous", structure:"will be + 4th form", example:"I will be playing." },
  ]],
  ["Perfect", [
    { name:"Present Perfect", structure:"has/have + 3rd form", example:"I have played." },
    { name:"Past Perfect", structure:"had + 3rd form", example:"I had played." },
    { name:"Future Perfect", structure:"will have + 3rd form", example:"I will have played." },
  ]],
  ["Perfect Continuous", [
    { name:"Present Perfect Continuous", structure:"has/have been + 4th form", example:"I have been playing." },
    { name:"Past Perfect Continuous", structure:"had been + 4th form", example:"I had been playing." },
    { name:"Future Perfect Continuous", structure:"will have been + 4th form", example:"I will have been playing." },
  ]],
];

const grid = document.getElementById("chart-grid");
let html = "";
CHART.forEach(([label, cells])=>{
  html += `<div class="row-label">${label}</div>`;
  cells.forEach(c=>{
    html += `
      <div class="cell">
        <h3>${c.name}</h3>
        <p class="structure">${c.structure}</p>
        <p class="example">${c.example}</p>
      </div>
    `;
  });
});
grid.innerHTML = html;
</script>


<script src="en-ai.js">
/* ── Dark Mode ── */
function toggleDark(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('en_theme', newTheme);
  const btn = document.getElementById('dark-toggle');
  if(btn) btn.textContent = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
}
(function(){
  const saved = localStorage.getItem('en_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
    const btn = document.getElementById('dark-toggle');
    if(btn) btn.textContent = '☀️ Light';
  }
})();

</script>
</body>
</html>
