<!DOCTYPE html>
<html lang="en">
<head>
<script src="en-guard.js"></script>
<meta charset="UTF-8">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hafeezurrehman-hub.github.io/English-notebook/leaderboard.html">
<meta property="og:title" content="Leaderboard — EnglishNotebook">
<meta property="og:description" content="See top English grammar learners on EnglishNotebook. Compete and improve!">
<meta property="og:image" content="https://hafeezurrehman-hub.github.io/English-notebook/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Leaderboard — EnglishNotebook">
<meta name="twitter:description" content="See top English grammar learners on EnglishNotebook. Compete and improve!">
<meta name="twitter:image" content="https://hafeezurrehman-hub.github.io/English-notebook/icon-512.png">
<meta name="description" content="See top English grammar learners on EnglishNotebook. Compete and improve!">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — EnglishNotebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#1B2A4A;--paper:#F7F4EC;--paper-line:#E4DFD0;--green:#2F6F5E;--clay:#B5482A;--muted:#8A8370;--card:#FFFFFF;--gold:#D4AF37;--silver:#A8A9AD;--bronze:#CD7F32;}
  [data-theme="dark"]{--ink:#E8E4DA;--paper:#141B2D;--paper-line:#1F2D45;--green:#4CAF8A;--muted:#7A8FA6;--card:#1A2540;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  [data-theme="dark"] body{background:var(--paper);}
  header{border-bottom:2px solid var(--ink);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(247,244,236,0.94);backdrop-filter:blur(6px);z-index:10;}
  [data-theme="dark"] header{background:rgba(20,27,45,0.96)!important;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;}
  .brand span{color:var(--green);}
  .back-link{font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;}
  #dark-toggle{background:none;border:1.5px solid var(--paper-line);border-radius:20px;padding:5px 11px;cursor:pointer;color:var(--ink);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;}

  main{max-width:760px;margin:0 auto;padding:40px 24px 80px;}
  .eyebrow{font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:10px;}
  h1{font-family:'Fraunces',serif;font-size:34px;margin:0 0 8px;}
  .sub{font-size:14px;color:var(--muted);margin:0 0 28px;line-height:1.6;}

  /* Filter tabs */
  .filter-tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:24px;}
  .ftab{padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;background:none;border-top:none;border-left:none;border-right:none;font-family:'Inter',sans-serif;}
  .ftab.active{color:var(--green);border-bottom-color:var(--green);}

  /* Top 3 podium */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-bottom:32px;padding:24px 0;}
  .podium-item{text-align:center;flex:1;max-width:180px;}
  .podium-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 8px;border:3px solid transparent;}
  .podium-item.rank-1 .podium-avatar{border-color:var(--gold);background:rgba(212,175,55,0.1);width:80px;height:80px;font-size:32px;}
  .podium-item.rank-2 .podium-avatar{border-color:var(--silver);background:rgba(168,169,173,0.1);}
  .podium-item.rank-3 .podium-avatar{border-color:var(--bronze);background:rgba(205,127,50,0.1);}
  .podium-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:4px;}
  .podium-score{font-size:13px;color:var(--muted);}
  .podium-rank{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
  .podium-item.rank-1 .podium-rank{color:var(--gold);}
  .podium-item.rank-2 .podium-rank{color:var(--silver);}
  .podium-item.rank-3 .podium-rank{color:var(--bronze);}
  .podium-bar{margin:0 auto;border-radius:6px 6px 0 0;}
  .podium-item.rank-1 .podium-bar{height:80px;background:linear-gradient(180deg,var(--gold),rgba(212,175,55,0.3));width:80%;}
  .podium-item.rank-2 .podium-bar{height:55px;background:linear-gradient(180deg,var(--silver),rgba(168,169,173,0.3));width:70%;}
  .podium-item.rank-3 .podium-bar{height:40px;background:linear-gradient(180deg,var(--bronze),rgba(205,127,50,0.3));width:70%;}

  /* Rankings list */
  .rank-row{background:var(--card);border:1.5px solid var(--paper-line);border-radius:12px;padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:14px;transition:transform 0.15s;}
  [data-theme="dark"] .rank-row{background:var(--card);}
  .rank-row:hover{transform:translateX(4px);}
  .rank-row.me{border-color:var(--green);box-shadow:2px 2px 0 var(--green);}
  .rank-num{font-family:'Fraunces',serif;font-size:18px;font-weight:700;width:32px;text-align:center;color:var(--muted);}
  .rank-num.gold{color:var(--gold);}
  .rank-num.silver{color:var(--silver);}
  .rank-num.bronze{color:var(--bronze);}
  .rank-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1B2A4A,#2F6F5E);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .rank-info{flex:1;}
  .rank-name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .rank-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .rank-score{text-align:right;}
  .rank-score .val{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--green);}
  .rank-score .lbl{font-size:11px;color:var(--muted);}
  .me-badge{font-size:10px;font-weight:700;background:var(--green);color:white;padding:2px 8px;border-radius:10px;margin-left:6px;}

  /* My rank card */
  .my-rank-card{background:linear-gradient(135deg,#1B2A4A,#2F6F5E);color:white;border-radius:14px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:center;gap:16px;}
  .my-rank-card .rank-big{font-family:'Fraunces',serif;font-size:40px;font-weight:700;}
  .my-rank-card .info-text{flex:1;}
  .my-rank-card .info-text .name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .my-rank-card .info-text .sub{font-size:13px;opacity:0.8;margin:4px 0 0;}
  .my-rank-card .score-big{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:#7EC8B0;}

  .loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
  .empty{text-align:center;padding:40px;font-family:'Fraunces',serif;font-size:18px;color:var(--muted);}

  /* Submit score btn */
  .submit-score-btn{width:100%;padding:13px;border-radius:25px;border:none;background:linear-gradient(135deg,#1B2A4A,#2F6F5E);color:white;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:20px;}
  .submit-score-btn:hover{opacity:0.9;}
</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">← Home</a>
  <div class="brand">English<span>Notebook</span></div>
  <button id="dark-toggle" onclick="toggleDark()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>Dark</button>
</header>

<main>
  <div class="eyebrow">Competition</div>
  <h1>Leaderboard</h1>
  <p class="sub">Top students ranked by overall course completion. Submit your score to compete!</p>

  <!-- My rank -->
  <div class="my-rank-card" id="my-rank-card" style="display:none">
    <div class="rank-big" id="my-rank-num">#—</div>
    <div class="info-text">
      <div class="name" id="my-rank-name">You</div>
      <div class="sub" id="my-rank-sub">Your position on the leaderboard</div>
    </div>
    <div class="score-big" id="my-rank-score">0%</div>
  </div>

  <button class="submit-score-btn" onclick="submitScore()" id="submit-btn">
    Submit My Score to Leaderboard
  </button>

  <!-- Filter tabs -->
  <div class="filter-tabs">
    <button class="ftab active" onclick="setFilter('all',this)">All Time</button>
    <button class="ftab" onclick="setFilter('week',this)">This Week</button>
    <button class="ftab" onclick="setFilter('streak',this)">By Streak</button>
  </div>

  <!-- Podium -->
  <div class="podium" id="podium"></div>

  <!-- Full list -->
  <div id="rank-list"><div class="loading">Loading leaderboard...</div></div>
</main>

<script src="en-gamification.js"></script>
<script src="en-ai.js"></script>
<script src="dark-mode.js"></script>
<script>
const SUPABASE_URL = "https://dcjiwlncugqihnkjbncm.supabase.co";
const SUPABASE_KEY = "sb_publishable_sQ-QfG_obdW1FN_js9_0ww_WqRGStRd";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentFilter = 'all';

const EMOJIS = ['😊','🎯','⭐','🔥','💪','🌟','🎓','🚀','📚','✨','🦁','🐯','🦊','🐧','🦋'];
function getEmoji(name){ return EMOJIS[name.charCodeAt(0) % EMOJIS.length]; }

function calcMyScore(){
  const TOTALS = {l1_noun:45,l2_pronoun:27,l3_verbforms:15,l4_5_tenses:84,l6_conjunctions:20,l7_tensepairs:14,l8_paragraph:13,l9_13_modals:23,v300:30};
  const progress = JSON.parse(localStorage.getItem('englishnotebook_progress_v1')||'{}');
  let correct=0, total=0;
  Object.entries(TOTALS).forEach(([lid,t])=>{
    const qs = progress.lessons?.[lid]?.questions||{};
    correct += Object.values(qs).filter(q=>q.correct).length;
    total += t;
  });
  return total>0 ? Math.round((correct/total)*100) : 0;
}

async function submitScore(){
  const session = (await sb.auth.getSession()).data.session;
  if(!session){ alert('Please login first to submit your score!'); window.location.href='auth.html'; return; }

  const score = calcMyScore();
  const streak = (JSON.parse(localStorage.getItem('en_streak')||'{}')).count || 0;
  const badges = JSON.parse(localStorage.getItem('en_badges')||'[]').length;

  const btn = document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='⏳ Submitting...';

  const {error} = await sb.from('leaderboard').upsert({
    user_id: session.user.id,
    score_pct: score,
    streak_days: streak,
    badges_count: badges,
    updated_at: new Date().toISOString()
  }, {onConflict:'user_id'});

  if(error){ alert('Error: '+error.message); }
  else { alert('✅ Score submitted! You are on the leaderboard.'); loadLeaderboard(); }
  btn.disabled=false; btn.textContent='Submit My Score to Leaderboard';
}

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadLeaderboard();
}

async function loadLeaderboard(){
  document.getElementById('rank-list').innerHTML = '<div class="loading">Loading...</div>';
  document.getElementById('podium').innerHTML = '';

  let orderCol = currentFilter==='streak' ? 'streak_days' : 'score_pct';

  let query = sb.from('leaderboard')
    .select('*, profiles(full_name, email)')
    .order(orderCol, {ascending:false})
    .limit(50);

  if(currentFilter === 'week'){
    const weekAgo = new Date(Date.now()-7*86400000).toISOString();
    query = query.gte('updated_at', weekAgo);
  }

  const {data, error} = await query;

  if(error || !data){
    document.getElementById('rank-list').innerHTML = '<div class="empty">Could not load leaderboard.</div>';
    return;
  }
  if(data.length === 0){
    document.getElementById('rank-list').innerHTML = '<div class="empty">No scores yet! Be the first to submit.</div>';
    return;
  }

  // My rank
  const session = (await sb.auth.getSession()).data.session;
  const myId = session?.user?.id;
  const myRank = data.findIndex(d=>d.user_id===myId);

  if(myRank !== -1 && myId){
    const me = data[myRank];
    const myName = me.profiles?.full_name || 'You';
    document.getElementById('my-rank-card').style.display='flex';
    document.getElementById('my-rank-num').textContent = '#'+(myRank+1);
    document.getElementById('my-rank-name').textContent = myName;
    document.getElementById('my-rank-sub').textContent = `${me.streak_days} day streak · ${me.badges_count} badges`;
    document.getElementById('my-rank-score').textContent = me.score_pct+'%';
  }

  // Podium (top 3)
  const top3 = data.slice(0,3);
  const podiumOrder = top3.length>=2 ? [top3[1],top3[0],top3[2]].filter(Boolean) : top3;
  const podiumRanks = top3.length>=2 ? [2,1,3] : [1,2,3];

  document.getElementById('podium').innerHTML = podiumOrder.map((p,i)=>{
    const rank = podiumRanks[i];
    const name = (p.profiles?.full_name || 'Student').split(' ')[0];
    const rankLabel = rank===1?'1st':rank===2?'2nd':'3rd';
    const val = currentFilter==='streak' ? p.streak_days+'d' : p.score_pct+'%';
    return `
      <div class="podium-item rank-${rank}">
        <div class="podium-rank">${rankLabel}</div>
        <div class="podium-avatar">${getEmoji(name)}</div>
        <div class="podium-name">${name}</div>
        <div class="podium-score">${val}</div>
        <div class="podium-bar"></div>
      </div>
    `;
  }).join('');

  // Full list (from rank 4)
  const listData = data.slice(0);
  document.getElementById('rank-list').innerHTML = listData.map((p,i)=>{
    const rank = i+1;
    const name = p.profiles?.full_name || 'Student';
    const firstName = name.split(' ')[0];
    const isMe = p.user_id === myId;
    const numClass = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    const val = currentFilter==='streak' ? p.streak_days+' days' : p.score_pct+'%';
    return `
      <div class="rank-row ${isMe?'me':''}">
        <div class="rank-num ${numClass}">${rank}</div>
        <div class="rank-avatar">${getEmoji(name)}</div>
        <div class="rank-info">
          <div class="rank-name">${firstName}${isMe?'<span class="me-badge">You</span>':''}</div>
          <div class="rank-sub">${p.streak_days}d streak · ${p.badges_count} badges</div>
        </div>
        <div class="rank-score">
          <div class="val">${val}</div>
          <div class="lbl">${currentFilter==='streak'?'streak':'score'}</div>
        </div>
      </div>
    `;
  }).join('');
}

loadLeaderboard();
</script>
</body>
</html>
