<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — EnglishNotebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#1B2A4A;--paper:#F7F4EC;--paper-line:#E4DFD0;--green:#2F6F5E;--clay:#B5482A;--muted:#8A8370;--card:#FFFFFF;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  header{border-bottom:2px solid var(--ink);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;}
  .brand span{color:var(--green);}
  main{max-width:640px;margin:0 auto;padding:40px 24px 80px;}
  h1{font-family:'Fraunces',serif;font-size:30px;margin:0 0 6px;}
  p.sub{font-size:14px;color:var(--muted);margin:0 0 32px;}
  .plan-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:20px;}
  .plan-badge.starter{background:rgba(47,111,94,0.12);color:var(--green);}
  .plan-badge.unlimited{background:rgba(74,144,217,0.12);color:#4A90D9;}
  .method-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px;}
  .method-card{background:var(--card);border:2px solid var(--paper-line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.15s;}
  .method-card:hover,.method-card.selected{border-color:var(--green);box-shadow:2px 2px 0 var(--green);}
  .method-icon{font-size:28px;margin-bottom:6px;height:60px;display:flex;align-items:center;justify-content:center;}
  .method-name{font-size:13px;font-weight:700;}
  .method-num{font-size:12px;color:var(--muted);margin-top:2px;}
  .payment-details{background:var(--card);border:1.5px solid var(--paper-line);border-radius:12px;padding:20px 22px;margin-bottom:24px;display:none;}
  .payment-details.show{display:block;}
  .detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--paper-line);}
  .detail-row:last-child{border:none;}
  .detail-label{font-size:13px;color:var(--muted);}
  .detail-value{font-size:14px;font-weight:700;font-family:'Fraunces',serif;}
  .copy-btn{font-size:11px;background:var(--paper-line);border:none;padding:3px 9px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;}
  .copy-btn:hover{background:var(--green);color:#fff;}
  .form-group{margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:6px;}
  input,textarea{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--paper-line);background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:1px;}
  textarea{min-height:80px;resize:vertical;}
  .btn{width:100%;padding:14px;border-radius:25px;border:none;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
  .btn:hover{background:var(--green);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .msg{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:13.5px;display:none;}
  .msg.error{background:rgba(181,72,42,0.1);color:var(--clay);display:block;}
  .msg.success{background:rgba(47,111,94,0.1);color:var(--green);display:block;}
  .step-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:10px;}
  @media(max-width:500px){.method-grid{grid-template-columns:1fr 1fr;}}

  .discount-wrap{margin-bottom:20px;}
  .discount-row{display:flex;gap:10px;}
  .discount-input{flex:1;padding:10px 13px;border-radius:9px;border:1.5px solid var(--paper-line);background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  .discount-btn{padding:10px 18px;border-radius:9px;border:none;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
  .discount-btn:hover{background:var(--green);}
  .discount-result{margin-top:8px;font-size:13px;display:none;}
  .discount-result.valid{color:var(--green);display:block;}
  .discount-result.invalid{color:var(--clay);display:block;}

</style>
</head>
<body>
<header>
  <a href="pricing.html" style="font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;">← Back</a>
  <div class="brand">English<span>Notebook</span></div>
  <div style="width:60px"></div>
</header>

<main>
  <h1>Complete Your Payment</h1>
  <p class="sub">Select payment method → send payment → submit transaction ID</p>
  <div id="plan-badge" class="plan-badge"></div>

  <div class="step-label">Step 1 — Select Payment Method</div>
  <div class="method-grid">
    <div class="method-card" onclick="selectMethod('jazzcash')">
      <div class="method-icon">
        <img src="https://www.jazzcash.com.pk/assets/images/logo.png" 
             alt="JazzCash" style="width:70px;height:48px;object-fit:contain;"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span style="display:none;font-size:32px">📱</span>
      </div>
      <div class="method-name">JazzCash</div>
      <div class="method-num">03075253269</div>
    </div>
    <div class="method-card" onclick="selectMethod('easypaisa')">
      <div class="method-icon">
        <img src="https://easypaisa.com.pk/wp-content/themes/easypaisa/assets/img/ep-logo.svg"
             alt="EasyPaisa" style="width:70px;height:48px;object-fit:contain;"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span style="display:none;font-size:32px">💚</span>
      </div>
      <div class="method-name">EasyPaisa</div>
      <div class="method-num">03110528707</div>
    </div>
    <div class="method-card" onclick="selectMethod('bank')">
      <div class="method-icon">
        <img src="https://www.meezanbank.com/wp-content/uploads/2021/03/meezan-bank-logo.png"
             alt="Meezan Bank" style="width:70px;height:48px;object-fit:contain;"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span style="display:none;font-size:32px">🏦</span>
      </div>
      <div class="method-name">Bank Transfer</div>
      <div class="method-num">Meezan Bank</div>
    </div>
  </div>

  <!-- Payment details box -->
  <div class="payment-details" id="payment-details">
    <div id="details-content"></div>
  </div>  <!-- Discount Code -->
  <div class="discount-wrap" id="discount-wrap" style="display:none">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:8px;">Have a Discount Code?</div>
    <div class="discount-row">
      <input type="text" class="discount-input" id="discount-input" placeholder="Enter code (e.g. WELCOME50)">
      <button class="discount-btn" onclick="applyDiscount()">Apply</button>
    </div>
    <div class="discount-result" id="discount-result"></div>
  </div>

  <div id="submit-form" style="display:none">
    <div class="step-label" style="margin-top:24px;">Step 2 — Submit Your Transaction</div>
    <div class="form-group">
      <label>Transaction ID / Reference Number</label>
      <input type="text" id="txn-id" placeholder="e.g. TXN123456789">
    </div>
    <div class="form-group">
      <label>Your Name (as sent)</label>
      <input type="text" id="sender-name" placeholder="Name you used for payment">
    </div>
    <div class="form-group">
      <label>Note (optional)</label>
      <textarea id="note" placeholder="Any additional information..."></textarea>
    </div>
    <button class="btn" onclick="submitPayment()">Submit Payment Request</button>
    <div class="msg" id="submit-msg"></div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://dcjiwlncugqihnkjbncm.supabase.co";
const SUPABASE_KEY = "sb_publishable_sQ-QfG_obdW1FN_js9_0ww_WqRGStRd";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const plan = params.get('plan') || 'starter';
const amount = plan === 'unlimited' ? 500 : 300;

let currentUser = null;
let selectedMethod = null;

// Auth check
sb.auth.getSession().then(({data:{session}})=>{
  if(!session){ window.location.href = 'auth.html'; return; }
  currentUser = session.user;
});

// Show plan badge
const badge = document.getElementById('plan-badge');
badge.textContent = plan === 'unlimited' ? '⭐ AI Unlimited — Rs. 500/month' : '✅ AI Starter — Rs. 300/month';
badge.className = `plan-badge ${plan}`;

const PAYMENT_DETAILS = {
  jazzcash: {
    rows: [
      {label:'Account Title', value:'HAFEEZ UR REHMAN'},
      {label:'JazzCash Number', value:'03075253269'},
      {label:'Amount', value:`Rs. ${amount.toLocaleString()}`},
    ]
  },
  easypaisa: {
    rows: [
      {label:'Account Title', value:'HAFEEZ UR REHMAN'},
      {label:'EasyPaisa Number', value:'03110528707'},
      {label:'Amount', value:`Rs. ${amount.toLocaleString()}`},
    ]
  },
  bank: {
    rows: [
      {label:'Account Title', value:'HAFEEZ UR REHMAN'},
      {label:'Bank', value:'MEEZAN DIGITAL CENTRE'},
      {label:'Account Number', value:'00300109755028'},
      {label:'IBAN', value:'PK70MEZN0000300109755028'},
      {label:'Amount', value:`Rs. ${amount.toLocaleString()}`},
    ]
  }
};

function selectMethod(method){
  selectedMethod = method;
  document.querySelectorAll('.method-card').forEach(c=>c.classList.remove('selected'));
  event.currentTarget.classList.add('selected');

  const details = PAYMENT_DETAILS[method];
  const html = details.rows.map(r=>`
    <div class="detail-row">
      <span class="detail-label">${r.label}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="detail-value">${r.value}</span>
        <button class="copy-btn" onclick="copyText('${r.value}')">Copy</button>
      </span>
    </div>
  `).join('');

  document.getElementById('details-content').innerHTML = html;
  document.getElementById('payment-details').classList.add('show');
  document.getElementById('submit-form').style.display = 'block';
  document.getElementById('discount-wrap').style.display = 'block';
}

function copyText(text){
  navigator.clipboard.writeText(text).then(()=>{
    alert('Copied: ' + text);
  });
}

function showMsg(text, type){
  const el = document.getElementById('submit-msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

/* ── Discount Codes ── */
const DISCOUNT_CODES = {
  'WELCOME50': { discount: 50, type: 'percent', desc: '50% off your first month!' },
  'STUDENT30': { discount: 30, type: 'percent', desc: '30% student discount!' },
  'HAFEEZ100': { discount: 100, type: 'percent', desc: '100% off (Free upgrade!)' },
  'REFER200':  { discount: 200, type: 'flat',    desc: 'Rs. 200 referral discount!' },
};

let appliedDiscount = null;

async function applyDiscount(){
  const code = document.getElementById('discount-input').value.trim().toUpperCase();
  const resultEl = document.getElementById('discount-result');
  
  if(!code){ return; }

  // Check local codes first
  if(DISCOUNT_CODES[code]){
    const d = DISCOUNT_CODES[code];
    appliedDiscount = d;
    appliedDiscount.code = code;
    
    // Calculate discounted amount
    const originalAmount = plan === 'unlimited' ? 500 : 300;
    let finalAmount = originalAmount;
    if(d.type === 'percent') finalAmount = Math.round(originalAmount * (1 - d.discount/100));
    else if(d.type === 'flat') finalAmount = Math.max(0, originalAmount - d.discount);
    
    resultEl.className = 'discount-result valid';
    resultEl.innerHTML = `✅ Code applied! ${d.desc} — Final amount: <strong>Rs. ${finalAmount.toLocaleString()}</strong>`;
    
    // Update payment details to show new amount
    updatePaymentAmount(finalAmount);
    return;
  }

  // Code not found in local codes
  resultEl.className = 'discount-result invalid';
  resultEl.textContent = '❌ Invalid or expired code.';
  appliedDiscount = null;
}

function updatePaymentAmount(newAmount){
  // Update amount display in payment details
  const amountRows = document.querySelectorAll('.detail-value');
  amountRows.forEach(el => {
    if(el.textContent.includes('Rs.')){
      el.textContent = `Rs. ${newAmount.toLocaleString()}`;
    }
  });
}

async function submitPayment(){
  if(!selectedMethod){ alert('Please select a payment method first.'); return; }
  const txnId = document.getElementById('txn-id').value.trim();
  const senderName = document.getElementById('sender-name').value.trim();
  const note = document.getElementById('note').value.trim();

  if(!txnId || !senderName){
    showMsg('Please fill Transaction ID and your name.', 'error'); return;
  }

  const originalAmount = plan === 'unlimited' ? 500 : 300;
  let finalAmount = originalAmount;
  if(appliedDiscount){
    if(appliedDiscount.type === 'percent') finalAmount = Math.round(originalAmount * (1 - appliedDiscount.discount/100));
    else if(appliedDiscount.type === 'flat') finalAmount = Math.max(0, originalAmount - appliedDiscount.discount);
  }

  const btn = document.querySelector('#submit-form .btn');
  btn.disabled = true; btn.textContent = 'Submitting...';

  const {error} = await sb.from('payments').insert({
    user_id: currentUser.id,
    amount: finalAmount,
    method: selectedMethod,
    transaction_id: txnId,
    plan: plan,
    duration_months: 1,
    status: 'pending',
    admin_note: `Sender: ${senderName}. Code: ${appliedDiscount?.code || 'none'}. Note: ${note}`
  });

  if(error){
    showMsg('Error: ' + error.message, 'error');
    btn.disabled=false; btn.textContent='Submit Payment Request';
  } else {
    showMsg('✅ Payment request submitted! Your account will be activated within a few hours.', 'success');
    btn.disabled = true; btn.textContent = 'Submitted ✅';
  }
}


</script>
</body>
</html>
