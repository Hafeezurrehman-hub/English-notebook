<style>
  :root{
    --ink:#1B2A4A; --paper:#F7F4EC; --paper-line:#E4DFD0;
    --green:#2F6F5E; --clay:#B5482A; --muted:#8A8370; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{
    background:linear-gradient(135deg,#1B2A4A 0%,#2F6F5E 100%);
    color:#fff; font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.25);
    border-radius:22px;
    padding:48px 36px;
    max-width:460px; width:100%;
    text-align:center;
    backdrop-filter:blur(6px);
  }
  .emoji{font-size:56px; margin-bottom:18px;}
  .eyebrow{
    font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(255,255,255,0.65); font-weight:700; margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:clamp(26px,6vw,34px); line-height:1.25; margin:0 0 10px;
  }
  h1 span{color:#8FD6BE;}
  p.sub{
    font-size:14.5px; color:rgba(255,255,255,0.8); line-height:1.7;
    margin:0 0 8px;
  }
  .btn-next{
    display:inline-block; margin-top:28px;
    background:#fff; color:#1B2A4A;
    font-family:'Inter',sans-serif; font-size:15px; font-weight:700;
    padding:14px 36px; border-radius:26px; text-decoration:none;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    border:none; cursor:pointer;
    transition:transform 0.15s;
  }
  .btn-next:hover{ transform:translateY(-2px); }
  .skip{
    display:block; margin-top:16px; font-size:12.5px;
    color:rgba(255,255,255,0.55); text-decoration:underline; cursor:pointer;
  }
</style>
</head>
<body>

<div class="card">
  <div class="emoji">👋</div>
  <div class="eyebrow">Welcome</div>
  <h1>Welcome, <span id="welcome-name">Student</span>!</h1>
  <p class="sub">We're glad to have you here. Your English learning journey starts now — 13 lessons, quizzes, and an AI Grammar Coach are all ready for you.</p>
  <button class="btn-next" onclick="goToApp()">Next → Start Learning</button>
</div>

<script>
const SUPABASE_URL = "https://dcjiwlncugqihnkjbncm.supabase.co";
const SUPABASE_KEY = "sb_publishable_sQ-QfG_obdW1FN_js9_0ww_WqRGStRd";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){
    window.location.replace('auth.html');
    return;
  }

  // Prefer the name from localStorage (set right after signup/login),
  // fall back to the profile row, then to the email's first part.
  let name = localStorage.getItem('en_user_name');
  if(!name){
    const {data:{user}} = await sb.auth.getUser();
    if(user){
      const {data:profile} = await sb.from('profiles').select('full_name').eq('id',user.id).single();
      name = (profile && profile.full_name) || (user.email ? user.email.split('@')[0] : 'Student');
      if(profile && profile.full_name){
        localStorage.setItem('en_user_name', profile.full_name);
      }
    }
  }
  document.getElementById('welcome-name').textContent = name || 'Student';
})();

function goToApp(){
  window.location.href = 'index.html';
}
</script>

</body>
</html>
