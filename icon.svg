<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2A4A"/>
      <stop offset="100%" style="stop-color:#2F6F5E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Book -->
  <g transform="translate(256,220)">
    <rect x="-80" y="-55" width="70" height="110" rx="4" fill="#F7F4EC" opacity="0.9"/>
    <rect x="10" y="-55" width="70" height="110" rx="4" fill="#F7F4EC"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#E4DFD0" stroke-width="2"/>
    <!-- Lines on left page -->
    <line x1="-65" y1="-30" x2="-25" y2="-30" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-65" y1="-15" x2="-35" y2="-15" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-65" y1="0" x2="-20" y2="0" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-65" y1="15" x2="-40" y2="15" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <!-- Lines on right page -->
    <line x1="25" y1="-30" x2="65" y2="-30" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="-15" x2="55" y2="-15" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="60" y2="0" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="15" x2="50" y2="15" stroke="#E4DFD0" stroke-width="3" stroke-linecap="round"/>
    <!-- Checkmark on right page -->
    <polyline points="32,30 42,42 62,18" fill="none" stroke="#2F6F5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- EN text -->
  <text x="256" y="370" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="80" fill="#F7F4EC" letter-spacing="8">EN</text>
  <!-- Small pencil -->
  <g transform="translate(370,140) rotate(45)">
    <rect x="-4" y="-30" width="8" height="40" rx="2" fill="#D48C00"/>
    <polygon points="-4,10 4,10 0,20" fill="#F7F4EC"/>
    <rect x="-4" y="-30" width="8" height="8" rx="2" fill="#B5482A"/>
  </g>
</svg>