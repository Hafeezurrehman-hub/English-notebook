<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup — EnglishNotebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#1B2A4A;--paper:#F7F4EC;--paper-line:#E4DFD0;--green:#2F6F5E;--clay:#B5482A;--muted:#8A8370;--card:#FFFFFF;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  header{border-bottom:2px solid var(--ink);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;}
  .brand span{color:var(--green);}
  .home-link{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;}
  .home-link:hover{color:var(--green);}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:4px 4px 0 var(--ink);}
  .card h1{font-family:'Fraunces',serif;font-size:26px;margin:0 0 6px;}
  .card p.sub{font-size:13.5px;color:var(--muted);margin:0 0 28px;}
  .tabs{display:flex;border-bottom:2px solid var(--paper-line);margin-bottom:24px;}
  .tab{flex:1;padding:10px;text-align:center;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}
  .form-group{margin-bottom:16px;}
  label{display:block;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:6px;}
  input{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--paper-line);background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14.5px;}
  input:focus-visible{outline:2px solid var(--green);outline-offset:1px;}
  .btn{width:100%;padding:13px;border-radius:25px;border:none;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
  .btn:hover{background:var(--green);}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{margin-top:14px;padding:11px 13px;border-radius:9px;font-size:13.5px;display:none;}
  .msg.error{background:rgba(181,72,42,0.1);color:var(--clay);display:block;}
  .msg.success{background:rgba(47,111,94,0.1);color:var(--green);display:block;}
  .switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--muted);}
  .switch a{color:var(--green);font-weight:600;cursor:pointer;text-decoration:none;}
</style>
</head>
<body>
<header>
  <a href="index.html" class="home-link">← Home</a>
  <div class="brand">English<span>Notebook</span></div>
  <div style="width:60px"></div>
</header>
<main>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="showTab('login')">Login</div>
      <div class="tab" id="tab-signup" onclick="showTab('signup')">Sign Up</div>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button class="btn" onclick="doLogin()">Login</button>
      <div class="msg" id="login-msg"></div>
      <div style="text-align:center;margin-top:10px;">
      <a onclick="showForgot()" style="font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;">Forgot Password?</a>
    </div>
    <div class="switch">Don't have an account? <a onclick="showTab('signup')">Sign Up</a></div>
    </div>

    <!-- Forgot Password Form -->
    <div id="form-forgot" style="display:none">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:36px;margin-bottom:8px;">🔑</div>
        <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:600;">Reset Password</div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px;">Enter your email and we'll send you a reset link.</div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="forgot-email" placeholder="your@email.com">
      </div>
      <button class="btn" onclick="doForgot()">Send Reset Link</button>
      <div class="msg" id="forgot-msg"></div>
      <div class="switch"><a onclick="showTab('login')">← Back to Login</a></div>
    </div>

    <!-- Signup Form -->
    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-pass" placeholder="Min 6 characters">
      </div>
      <button class="btn" onclick="doSignup()">Create Account</button>
      <div class="msg" id="signup-msg"></div>
      <div class="switch">Already have an account? <a onclick="showTab('login')">Login</a></div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://dcjiwlncugqihnkjbncm.supabase.co";
const SUPABASE_KEY = "sb_publishable_sQ-QfG_obdW1FN_js9_0ww_WqRGStRd";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// If already logged in, redirect
sb.auth.getSession().then(({data:{session}})=>{
  if(session) window.location.href = "index.html";
});

function showTab(tab){
  document.getElementById('form-login').style.display = tab==='login'?'block':'none';
  document.getElementById('form-signup').style.display = tab==='signup'?'block':'none';
  document.getElementById('form-forgot').style.display='none';
  document.querySelector('.tabs').style.display='flex';
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
}

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if(!email || !pass){ showMsg('login-msg','Please fill all fields','error'); return; }
  const btn = document.querySelector('#form-login .btn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  const {error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error){ showMsg('login-msg', error.message, 'error'); btn.disabled=false; btn.textContent='Login'; }
  else {
    // Mark as logged in for session persistence
    localStorage.setItem('en_logged_in', '1');
    // Sync plan from Supabase to localStorage
    const {data:{user}} = await sb.auth.getUser();
    if(user){
      const {data:profile} = await sb.from('profiles').select('plan,full_name').eq('id',user.id).single();
      if(profile){
        try{
          const progress = JSON.parse(localStorage.getItem('englishnotebook_progress_v1')||'{}');
          progress.plan = profile.plan || 'free';
          localStorage.setItem('englishnotebook_progress_v1', JSON.stringify(progress));
          localStorage.setItem('en_user_name', profile.full_name || '');
        }catch(e){}
      }
    }
    window.location.href = 'welcome.html';
  }
}

async function doSignup(){
  const name  = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pass  = document.getElementById('signup-pass').value;
  if(!name||!email||!pass){ showMsg('signup-msg','Please fill all fields','error'); return; }
  if(pass.length < 6){ showMsg('signup-msg','Password must be at least 6 characters','error'); return; }
  const btn = document.querySelector('#form-signup .btn');
  btn.disabled=true; btn.textContent='Creating account...';
  const {error} = await sb.auth.signUp({
    email, password:pass,
    options:{ data:{ full_name: name } }
  });
  if(error){ showMsg('signup-msg', error.message, 'error'); btn.disabled=false; btn.textContent='Create Account'; }
  else {
    showMsg('signup-msg','Account created! Redirecting...','success');
    // Mark as logged in for session persistence
    localStorage.setItem('en_logged_in', '1');
    // Set free plan in localStorage
    try{
      const progress = JSON.parse(localStorage.getItem('englishnotebook_progress_v1')||'{}');
      progress.plan = 'free';
      localStorage.setItem('englishnotebook_progress_v1', JSON.stringify(progress));
      localStorage.setItem('en_user_name', name);
    }catch(e){}
    setTimeout(()=> window.location.href='welcome.html', 1200);
  }
}

// Enter key support
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    if(document.getElementById('form-login').style.display!=='none') doLogin();
    else doSignup();
  }
});

function showForgot(){
  document.getElementById('form-login').style.display='none';
  document.getElementById('form-signup').style.display='none';
  document.getElementById('form-forgot').style.display='block';
  document.querySelector('.tabs').style.display='none';
}

async function doForgot(){
  const email = document.getElementById('forgot-email').value.trim();
  if(!email){ showMsg('forgot-msg','Please enter your email','error'); return; }
  const btn = document.querySelector('#form-forgot .btn');
  btn.disabled=true; btn.textContent='Sending...';
  const {error} = await sb.auth.resetPasswordForEmail(email,{
    redirectTo: 'https://hafeezurrehman-hub.github.io/-EnglishNotebook/auth.html'
  });
  if(error){ showMsg('forgot-msg',error.message,'error'); btn.disabled=false; btn.textContent='Send Reset Link'; }
  else { showMsg('forgot-msg','✅ Reset link sent! Check your email inbox.','success'); btn.textContent='Sent ✅'; }
}

</script>
</body>
</html>
